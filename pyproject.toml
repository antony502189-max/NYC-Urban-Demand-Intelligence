[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "nyc-urban-demand-intelligence"
version = "0.1.0"
description = "Production-oriented forecasting of hourly NYC taxi demand by zone."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Bogdan" }]
dependencies = [
  "httpx>=0.27,<1.0",
  "numpy>=1.26,<3.0",
  "polars>=1.0,<2.0",
  "pyarrow>=16,<24",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
ml = [
  "scikit-learn>=1.5,<2.0",
  "lightgbm>=4.5,<5.0",
  "optuna>=4.0,<5.0",
  "shap>=0.46,<1.0",
]
api = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
]
tracking = ["mlflow>=3.0,<4.0"]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nyc_demand"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# Keep CI focused on correctness and maintainability. E501 is intentionally
# excluded: line wrapping is formatter territory and should not make builds red.
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["nyc_demand"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
packages = ["nyc_demand"]
