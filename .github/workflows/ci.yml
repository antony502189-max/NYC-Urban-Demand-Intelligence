name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[ml,api,dev]"

      - name: Compile Python sources
        run: python -m compileall -q src tests scripts

      - name: Ruff
        run: ruff check src tests

      - name: Tests
        run: pytest --cov=nyc_demand --cov-report=term-missing
