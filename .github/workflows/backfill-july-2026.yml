name: Backfill July 2026 contributions

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Top up July dates to deterministic 1-27 contribution targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "antony502189-max"
          git config user.email "239196948+antony502189-max@users.noreply.github.com"

          gh api graphql -f query='query {
            user(login: "antony502189-max") {
              contributionsCollection(
                from: "2026-07-01T00:00:00Z"
                to: "2026-08-01T00:00:00Z"
              ) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }' > /tmp/july-contributions.json

          mkdir -p docs
          touch docs/july-development-log.md docs/july-contribution-plan.tsv

          if ! grep -q '^# July 2026 development checkpoints$' docs/july-development-log.md; then
            printf '# July 2026 development checkpoints\n\n' >> docs/july-development-log.md
          fi

          if ! grep -q '^date\tbaseline\ttarget$' docs/july-contribution-plan.tsv; then
            printf 'date\tbaseline\ttarget\n' >> docs/july-contribution-plan.tsv
          fi

          for day in $(seq -w 1 31); do
            marker="2026-07-${day}"
            next_marker=$(date -d "${marker} +1 day" +%F)

            graph_count=$(jq -r --arg date "$marker" '
              [.data.user.contributionsCollection.contributionCalendar.weeks[]
               .contributionDays[]
               | select(.date == $date)
               | .contributionCount][0] // 0
            ' /tmp/july-contributions.json)

            existing_plan=$(awk -F '\t' -v date="$marker" '$1 == date {print $2 " " $3}' docs/july-contribution-plan.tsv | tail -n 1)

            if [[ -n "$existing_plan" ]]; then
              read -r baseline target <<< "$existing_plan"
            else
              digest=$(printf '%s' "$marker" | sha256sum | cut -c1-8)
              target=$((1 + 0x${digest} % 27))
              baseline=$graph_count

              # Do not attempt to rewrite or remove genuine activity when a day
              # already exceeds the synthetic target.
              if (( baseline >= target )); then
                echo "Skipping ${marker}: existing ${baseline}, target ${target}."
                continue
              fi
            fi

            expected_additions=$((target - baseline))
            if (( expected_additions <= 0 )); then
              continue
            fi

            generated=$(git log --all \
              --since="${marker}T00:00:00+03:00" \
              --until="${next_marker}T00:00:00+03:00" \
              --pretty='%s' | \
              grep -Ec "^(chore: plan July activity ${marker}|chore: log July activity ${marker})" || true)

            remaining=$((expected_additions - generated))
            if (( remaining <= 0 )); then
              echo "${marker}: target ${target} already satisfied by planned commits."
              continue
            fi

            echo "${marker}: graph=${graph_count}, baseline=${baseline}, target=${target}, add=${remaining}."

            for offset in $(seq 1 "$remaining"); do
              ordinal=$((generated + offset))
              total_after=$((baseline + ordinal))

              # Spread timestamps across a normal working-day window instead of
              # assigning every commit the same clock time.
              minute_of_day=$((540 + (total_after * 720) / (target + 1)))
              hour=$((minute_of_day / 60))
              minute=$((minute_of_day % 60))
              timestamp=$(printf '%sT%02d:%02d:00+03:00' "$marker" "$hour" "$minute")

              if (( ordinal == 1 )) && [[ -z "$existing_plan" ]]; then
                printf '%s\t%s\t%s\n' "$marker" "$baseline" "$target" >> docs/july-contribution-plan.tsv
                printf -- '- %s activity %02d/%02d\n' "$marker" "$total_after" "$target" >> docs/july-development-log.md
                git add docs/july-contribution-plan.tsv docs/july-development-log.md
                message="chore: plan July activity ${marker} ${total_after}/${target}"
              else
                printf -- '- %s activity %02d/%02d\n' "$marker" "$total_after" "$target" >> docs/july-development-log.md
                git add docs/july-development-log.md
                message="chore: log July activity ${marker} ${total_after}/${target}"
              fi

              GIT_AUTHOR_DATE="$timestamp" \
              GIT_COMMITTER_DATE="$timestamp" \
                git commit -m "$message"
            done
          done

          git push origin HEAD:main
