name: Backfill contribution density

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: First date to top up (YYYY-MM-DD)
        required: true
        default: "2026-03-01"
        type: string
      end_date:
        description: Last date to top up (YYYY-MM-DD)
        required: true
        default: "2026-08-10"
        type: string

permissions:
  contents: write

concurrency:
  group: contribution-density-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      TARGET_MAX: "97"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Top up dates to deterministic 1-97 contribution targets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          git config user.name "antony502189-max"
          git config user.email "239196948+antony502189-max@users.noreply.github.com"

          if ! date -d "$START_DATE" +%F >/dev/null 2>&1; then
            echo "Invalid start_date: $START_DATE"
            exit 2
          fi
          if ! date -d "$END_DATE" +%F >/dev/null 2>&1; then
            echo "Invalid end_date: $END_DATE"
            exit 2
          fi
          if [[ "$END_DATE" < "$START_DATE" ]]; then
            echo "end_date must not precede start_date"
            exit 2
          fi

          graph_from="${START_DATE}T00:00:00Z"
          graph_to="$(date -d "${END_DATE} +1 day" +%F)T00:00:00Z"

          gh api graphql \
            -f query='query($from: DateTime!, $to: DateTime!) {
              user(login: "antony502189-max") {
                contributionsCollection(from: $from, to: $to) {
                  contributionCalendar {
                    weeks {
                      contributionDays {
                        date
                        contributionCount
                      }
                    }
                  }
                }
              }
            }' \
            -f from="$graph_from" \
            -f to="$graph_to" \
            > /tmp/contributions.json

          mkdir -p docs
          touch docs/contribution-backfill-log.md docs/contribution-backfill-plan-v97.tsv

          if ! grep -q '^# Contribution backfill log$' docs/contribution-backfill-log.md; then
            printf '# Contribution backfill log\n\n' >> docs/contribution-backfill-log.md
          fi

          if ! grep -q '^date\tobserved\ttarget$' docs/contribution-backfill-plan-v97.tsv; then
            printf 'date\tobserved\ttarget\n' >> docs/contribution-backfill-plan-v97.tsv
          fi

          push_progress() {
            local label="$1"
            local attempt

            echo "Pushing completed batch: ${label}"
            for attempt in 1 2 3; do
              git fetch origin main

              if ! git merge-base --is-ancestor origin/main HEAD; then
                echo "Remote main advanced; rebasing generated history before push."
                git rebase origin/main
              fi

              if git push origin HEAD:main; then
                echo "Batch ${label} pushed successfully."
                return 0
              fi

              echo "Push attempt ${attempt}/3 failed for ${label}; retrying in 5s."
              sleep 5
            done

            echo "Unable to push batch ${label} after 3 attempts."
            return 1
          }

          current="$START_DATE"
          total_created=0
          batch_created=0
          batch_month="${START_DATE:0:7}"

          while [[ "$current" < "$END_DATE" || "$current" == "$END_DATE" ]]; do
            marker="$current"
            next_marker=$(date -d "${marker} +1 day" +%F)

            graph_count=$(jq -r --arg date "$marker" '
              [.data.user.contributionsCollection.contributionCalendar.weeks[]
               .contributionDays[]
               | select(.date == $date)
               | .contributionCount][0] // 0
            ' /tmp/contributions.json)

            backfill_count=$(git log --all \
              --since="${marker}T00:00:00+03:00" \
              --until="${next_marker}T00:00:00+03:00" \
              --pretty='%s' | \
              grep -Ec "^chore: backfill activity ${marker} " || true)

            legacy_july_count=$(git log --all \
              --since="${marker}T00:00:00+03:00" \
              --until="${next_marker}T00:00:00+03:00" \
              --pretty='%s' | \
              grep -Ec "(record development checkpoint ${marker}$|July activity ${marker})" || true)

            synthetic_count=$((backfill_count + legacy_july_count))
            observed=$graph_count
            if (( synthetic_count > observed )); then
              observed=$synthetic_count
            fi

            digest=$(printf '%s' "nyc-demand:v97:${marker}" | sha256sum | cut -c1-8)
            target=$((1 + 0x${digest} % TARGET_MAX))

            if ! grep -q "^${marker}[[:space:]]" docs/contribution-backfill-plan-v97.tsv; then
              printf '%s\t%s\t%s\n' "$marker" "$observed" "$target" \
                >> docs/contribution-backfill-plan-v97.tsv
            fi

            if (( observed >= target )); then
              echo "${marker}: observed=${observed}, target=${target}; no top-up required."
            else
              remaining=$((target - observed))
              echo "${marker}: graph=${graph_count}, synthetic=${synthetic_count}, observed=${observed}, target=${target}, add=${remaining}."

              for offset in $(seq 1 "$remaining"); do
                total_after=$((observed + offset))

                minute_of_day=$((510 + (total_after * 780) / (target + 1)))
                hour=$((minute_of_day / 60))
                minute=$((minute_of_day % 60))
                timestamp=$(printf '%sT%02d:%02d:00+03:00' "$marker" "$hour" "$minute")

                printf -- '- %s v97 activity %02d/%02d\n' "$marker" "$total_after" "$target" \
                  >> docs/contribution-backfill-log.md
                git add docs/contribution-backfill-log.md docs/contribution-backfill-plan-v97.tsv

                GIT_AUTHOR_DATE="$timestamp" \
                GIT_COMMITTER_DATE="$timestamp" \
                  git commit -m "chore: backfill activity ${marker} v97 ${total_after}/${target}"

                total_created=$((total_created + 1))
                batch_created=$((batch_created + 1))

                if (( batch_created >= 500 )); then
                  push_progress "${batch_month}-${marker}-checkpoint"
                  batch_created=0
                fi
              done
            fi

            next_month="${next_marker:0:7}"
            if [[ "$next_month" != "$batch_month" || "$marker" == "$END_DATE" ]]; then
              if (( batch_created > 0 )); then
                push_progress "$batch_month"
              else
                echo "Batch ${batch_month}: nothing new to push."
              fi
              batch_month="$next_month"
              batch_created=0
            fi

            current="$next_marker"
          done

          echo "Created ${total_created} dated commits in total."
          echo "Backfill completed successfully."
