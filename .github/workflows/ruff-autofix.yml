name: Ruff Autofix

on:
  push:
    branches: [fix/ci-stability]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@v4
        with:
          ref: fix/ci-stability

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: python -m pip install "ruff==0.16.2"

      - name: Apply safe Ruff fixes
        run: ruff check src tests --fix

      - name: Commit fixes when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No Ruff changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "style: apply Ruff autofixes"
          git push origin HEAD:fix/ci-stability
