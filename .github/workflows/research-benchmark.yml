name: Research benchmark

on:
  workflow_dispatch:
    inputs:
      start_month:
        description: First TLC month (YYYY-MM)
        required: true
        default: "2024-01"
        type: string
      end_month:
        description: Last TLC month (YYYY-MM)
        required: true
        default: "2024-06"
        type: string
      horizon:
        description: Forecast horizon in hours
        required: true
        default: "6"
        type: choice
        options:
          - "1"
          - "6"
          - "24"

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      START_MONTH: ${{ inputs.start_month }}
      END_MONTH: ${{ inputs.end_month }}
      HORIZON: ${{ inputs.horizon }}
      DATASET_PATH: data/processed/research-demand.parquet
      FEATURES_PATH: data/features/research-features.parquet
      MODEL_DIR: artifacts/models/research
      REPORT_DIR: reports/research
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Prepare diagnostics directory
        run: |
          mkdir -p "$REPORT_DIR"
          python --version | tee "$REPORT_DIR/python-version.txt"
          df -h | tee "$REPORT_DIR/disk-before.txt"
          free -h | tee "$REPORT_DIR/memory-before.txt"

      - name: Install pinned research dependencies
        run: |
          set -o pipefail
          python -m pip install --upgrade pip 2>&1 | tee "$REPORT_DIR/pip-bootstrap.log"
          python -m pip install -c constraints/research.txt -e ".[ml,api,dev]" 2>&1 | tee "$REPORT_DIR/pip-install.log"
          python -m pip check 2>&1 | tee "$REPORT_DIR/pip-check.log"
          python -m pip freeze | sort > "$REPORT_DIR/environment.txt"

      - name: Build multi-month demand dataset
        run: |
          set -o pipefail
          python -u scripts/build_dataset.py \
            --start "$START_MONTH" \
            --end "$END_MONTH" \
            --output "$DATASET_PATH" \
            2>&1 | tee "$REPORT_DIR/build-dataset.log"

      - name: Download and validate taxi-zone lookup
        run: |
          set -o pipefail
          python -u -c "from nyc_demand.data.zones import download_zone_lookup; print(download_zone_lookup())" \
            2>&1 | tee "$REPORT_DIR/zone-lookup.log"

      - name: Generate deterministic EDA report
        run: |
          set -o pipefail
          python -u scripts/generate_eda_report.py \
            --input "$DATASET_PATH" \
            --zone-lookup data/reference/taxi_zone_lookup.csv \
            --output "$REPORT_DIR/eda.json" \
            2>&1 | tee "$REPORT_DIR/eda.log"

      - name: Materialize leakage-safe features
        run: |
          set -o pipefail
          python -u scripts/build_features.py \
            --input "$DATASET_PATH" \
            --output "$FEATURES_PATH" \
            2>&1 | tee "$REPORT_DIR/features.log"

      - name: Benchmark model against seasonal naive
        run: |
          set -o pipefail
          python -u scripts/benchmark_model.py \
            --input "$DATASET_PATH" \
            --horizon "$HORIZON" \
            --output "$REPORT_DIR/benchmark.json" \
            2>&1 | tee "$REPORT_DIR/benchmark.log"

      - name: Train final horizon model
        run: |
          set -o pipefail
          python -u scripts/train_model.py \
            --input "$DATASET_PATH" \
            --horizon "$HORIZON" \
            --model-dir "$MODEL_DIR" \
            --report "$REPORT_DIR/training.json" \
            2>&1 | tee "$REPORT_DIR/training.log"

      - name: Generate SHAP explanation report
        run: |
          set -o pipefail
          python -u scripts/explain_model.py \
            --model-dir "$MODEL_DIR" \
            --features "$FEATURES_PATH" \
            --output "$REPORT_DIR/shap.json" \
            --max-rows 5000 \
            --top-n 30 \
            2>&1 | tee "$REPORT_DIR/shap.log"

      - name: Render model card from real artifacts
        run: |
          set -o pipefail
          python -u scripts/render_model_card.py \
            --model-dir "$MODEL_DIR" \
            --benchmark "$REPORT_DIR/benchmark.json" \
            --shap "$REPORT_DIR/shap.json" \
            --output "$REPORT_DIR/model-card.md" \
            2>&1 | tee "$REPORT_DIR/model-card.log"

      - name: Record final runner resources
        if: always()
        run: |
          df -h > "$REPORT_DIR/disk-after.txt"
          free -h > "$REPORT_DIR/memory-after.txt"

      - name: Publish research artifacts and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nyc-demand-${{ inputs.start_month }}-${{ inputs.end_month }}-h${{ inputs.horizon }}
          if-no-files-found: warn
          retention-days: 30
          path: |
            reports/research/
            artifacts/models/research/
            data/processed/research-demand.build.json
